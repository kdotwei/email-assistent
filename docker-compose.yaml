services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - /scripts/n8n-entrypoint.sh
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/scripts:ro
      - ./n8n:/import/workflows:ro
      - ./n8n/credentials:/import/credentials:ro
    networks:
      - workflow_network

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - TZ=Asia/Taipei
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow/langflow.db
    volumes:
      - langflow_data:/app/langflow
    networks:
      - workflow_network

volumes:
  n8n_data:
    driver: local
  langflow_data:
    driver: local

networks:
  workflow_network:
    driver: bridge
