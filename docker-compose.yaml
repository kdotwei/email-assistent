version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ ! -f /home/node/.n8n/.workflow-imported ]; then
          /docker-entrypoint.sh import:workflow --separate --input=/import/workflow && \
          touch /home/node/.n8n/.workflow-imported
        fi
        exec /docker-entrypoint.sh start
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL="admin@example.com"
      - N8N_INSTANCE_OWNER_FIRSTNAME="Admin"
      - N8N_INSTANCE_OWNER_LASTNAME="User"
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2y$$10$$d/LjIP9EvN1NZxmTfPYhMOVNxqa.zIedvap7sSdFbNRlAK94/eppa
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflow:/import/workflow:ro
    networks:
      - workflow_network

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - TZ=Asia/Taipei
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow/langflow.db
    volumes:
      - langflow_data:/app/langflow
    networks:
      - workflow_network

volumes:
  n8n_data:
    driver: local
  langflow_data:
    driver: local

networks:
  workflow_network:
    driver: bridge
